<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var t=localStorage.getItem("matagent-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<title>MatAgent · Research agent for materials science</title>
<meta name="description" content="MatAgent is a research agent for materials science: it reads the literature, identifies missing data and formulates hypotheses screened by chemical-validity checks. Every run is recorded for review.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F6F8FB;
  --dot: #D5DDE8;
  --ink: #0B1220;
  --muted: #4B5970;
  --line: #C3CEDC;
  --node: #FFFFFF;
  --accent: #0E7F78;
  --accent-2: #9A600E;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0F1A;
    --dot: #1A2538;
    --ink: #E6EDF5;
    --muted: #8A97AB;
    --line: #24324A;
    --node: #101A2B;
    --accent: #4FD1C5;
    --accent-2: #F5B544;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0F1A;
  --dot: #1A2538;
  --ink: #E6EDF5;
  --muted: #8A97AB;
  --line: #24324A;
  --node: #101A2B;
  --accent: #4FD1C5;
  --accent-2: #F5B544;
}
* { box-sizing: border-box; }
html { color-scheme: light dark; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.2px);
  background-size: 18px 18px;
  color: var(--ink);
  font-family: "Geist", ui-sans-serif, system-ui, sans-serif;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: "Geist", ui-sans-serif, system-ui, sans-serif; font-weight: 600; line-height: 1.2; }
h1 { font-size: clamp(40px, 5.8vw, 68px); line-height: 1.02; letter-spacing: -.04em; margin: 16px 0 20px; max-width: 13ch; }
h2 { font-size: clamp(30px, 3.6vw, 44px); letter-spacing: -.035em; margin: 8px 0 12px; line-height: 1.08; }
.method, .kicker, .mono { font-family: "Geist Mono", ui-monospace, monospace; }
a { color: var(--accent); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
.site-header { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
.site-header .wrap { display: flex; align-items: center; gap: 16px; min-height: 68px; }
.brand { display: flex; align-items: center; gap: 11px; flex: none; white-space: nowrap; color: var(--ink); text-decoration: none; margin-right: auto; }
.brand img { width: 38px; height: 38px; border-radius: 9px; display: block; }
.lk { line-height: 1.05; }
.lk .s { display: block; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.lk .n { font-size: 21px; font-weight: 600; letter-spacing: -.025em; }
.site-nav { display: flex; gap: 20px; font-size: 13.5px; white-space: nowrap; }
.site-nav a { color: var(--muted); text-decoration: none; }
.site-nav a:hover { color: var(--ink); }
@media (max-width: 1059px) { .site-nav { display: none; } }
@media (max-width: 479px) { .site-header .btn-primary { display: none; } }
button, .btn { font: inherit; font-size: 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--node); color: var(--ink); padding: 8px 14px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
.sec { padding: 76px 0; border-top: 1px solid var(--line); }
.kicker { font-size: 12px; font-weight: 500; color: var(--accent); margin: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 16px; margin-top: 20px; }
.card { background: var(--node); border: 1px solid var(--line); border-radius: 12px; padding: 20px 20px 18px; display: flex; flex-direction: column; }
.card h3 { font-size: 18px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 8px; }
.card .plain { margin: 0 0 16px; font-size: 15px; line-height: 1.55; }
.card .method { margin: auto 0 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; line-height: 1.65; color: var(--muted); }
.card .method b, .card .method > span:first-child { display: block; font-weight: 500; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-2); margin-bottom: 4px; }
.card .nw { white-space: nowrap; }
figure.fig { margin: 48px 0 0; border: 1px solid var(--line); background: color-mix(in srgb, var(--node) 72%, transparent); border-radius: 14px; padding: 26px 26px 18px; }
figure.fig figcaption { font-family: "Geist Mono", ui-monospace, monospace; font-size: 12px; color: var(--muted); margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
figure .sch { width: 100%; height: auto; display: block; overflow: visible; }
.fig .narrow { display: none; }
@media (max-width: 719px) { .fig .wide { display: none; } .fig .narrow { display: block; } figure.fig { padding: 16px 12px 12px; } }
.sch .edge { stroke: var(--line); stroke-width: 1.4; fill: none; }
.sch .edge.rej { stroke: var(--accent-2); stroke-dasharray: 3 4; stroke-opacity: .7; }
.sch .port { fill: var(--bg); stroke: var(--line); stroke-width: 1.4; }
.sch .port.rej { stroke: var(--accent-2); }
.sch .box { fill: var(--node); stroke: var(--line); stroke-width: 1.2; }
.sch .gate .box { stroke: color-mix(in srgb, var(--accent-2) 55%, var(--line)); }
.sch .ic { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.sch .gate .ic { stroke: var(--accent-2); }
.sch .idx { fill: var(--muted); font: 500 10.5px "Geist Mono", ui-monospace, monospace; opacity: .75; }
.sch .ttl { fill: var(--ink); font: 600 15px "Geist", ui-sans-serif, system-ui, sans-serif; letter-spacing: -.01em; }
.sch .sub { fill: var(--muted); font: 11px "Geist Mono", ui-monospace, monospace; }
.sch .hl { fill: var(--accent); fill-opacity: .06; stroke: var(--accent); stroke-width: 1.6; }
.sch .hl.amber { fill: var(--accent-2); stroke: var(--accent-2); }
.sch .bin rect { fill: color-mix(in srgb, var(--accent-2) 7%, var(--node)); stroke: var(--accent-2); stroke-opacity: .55; stroke-dasharray: 4 4; }
.sch .bin .x { stroke: var(--accent-2); stroke-width: 1.6; stroke-linecap: round; fill: none; }
.sch .chips rect { fill: var(--node); stroke: var(--accent); stroke-width: 1.2; }
.sch .chips text { fill: var(--accent); font: 600 9.5px "Geist Mono", ui-monospace, monospace; }
/* reveal: nodes rise in, edges draw (edges need pathLength="1"), then the controller unpauses tokens */
.sch .node { opacity: 0; transform: translateY(8px); transition: opacity .5s ease, transform .6s cubic-bezier(.2,.7,.2,1); transition-delay: calc(var(--i, 0) * 90ms); }
.sch .edge { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .9s ease .35s; }
.sch .edge.rej { stroke-dasharray: 3 4; stroke-dashoffset: 0; opacity: 0; transition: opacity .6s ease .8s; }
.in .sch .node { opacity: 1; transform: none; }
.in .sch .edge { stroke-dashoffset: 0; }
.in .sch .edge.rej { opacity: 1; }
.site-footer { border-top: 1px solid var(--line); padding: 24px 0; color: var(--muted); font-size: 14px; }
@media (prefers-reduced-motion: reduce) {
  .particle { display: none; }
  .sch .node, .sch .edge { transition: none; opacity: 1; transform: none; stroke-dashoffset: 0; }
}
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="#top"><img src="assets/matagent-mark.svg" alt="" width="38" height="38"><span class="lk"><span class="s">Materials Research Agent</span><span class="n">MatAgent</span></span></a>
    <nav class="site-nav" aria-label="Sections">
      <a href="#literature">Literature</a><a href="#gaps">Gaps</a><a href="#hypotheses">Hypotheses</a><a href="#planning">Planning</a><a href="#domains">Domains</a><a href="#record">Record</a><a href="#improvement">Improve</a><a href="#interfaces">Data</a>
    </nav>
    <button id="theme-toggle" type="button" aria-pressed="false" aria-label="Toggle dark theme">☾</button>
    <a class="btn btn-primary" href="mailto:lohgc@a-star.edu.sg?subject=MatAgent%20early%20access">Request early access</a>
  </div>
</header>
<main id="top"></main>
<footer class="site-footer">
  <div class="wrap"><p>Figures are schematic.</p></div>
</footer>
<script>
(function () {
  var root = document.documentElement, btn = document.getElementById("theme-toggle");
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  function current() { return root.dataset.theme || (mq.matches ? "dark" : "light"); }
  function show() { var d = current() === "dark"; btn.textContent = d ? "☀" : "☾"; btn.setAttribute("aria-pressed", d); }
  btn.addEventListener("click", function () {
    var next = current() === "dark" ? "light" : "dark";
    root.dataset.theme = next;
    try { localStorage.setItem("matagent-theme", next); } catch (e) {}
    show();
  });
  show();

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function each(fig, fn) { fig.querySelectorAll("svg.sch").forEach(function (s) { try { fn(s); } catch (e) {} }); }
  document.addEventListener("DOMContentLoaded", function () {
    var figs = document.querySelectorAll("figure.fig");
    figs.forEach(function (f) { each(f, function (s) { s.pauseAnimations(); s.setCurrentTime(0); }); });
    if (!("IntersectionObserver" in window)) { figs.forEach(function (f) { f.classList.add("in"); }); return; }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        var f = e.target;
        if (e.isIntersecting) {
          f.classList.add("in");
          if (!reduce) setTimeout(function () { each(f, function (s) { s.unpauseAnimations(); }); }, 1100);
        } else each(f, function (s) { s.pauseAnimations(); });
      });
    }, { threshold: 0.3 });
    figs.forEach(function (f) { io.observe(f); });
  });
})();
</script>
</body>
</html>
